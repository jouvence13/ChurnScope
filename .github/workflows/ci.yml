name: ChurnScope CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-test:
    name: Code Quality, Security & ML Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint code with Flake8
      run: |
        flake8 . --count --show-source --statistics

    - name: Check code formatting with Black
      run: |
        black --check src/ app.py tests/ scripts/

    - name: Run automated test suite with Pytest
      run: |
        pytest tests/ -v --junitxml=test-results.xml

    - name: Validate ML training pipeline & export artefacts
      run: |
        python src/export_model.py

    - name: Validate Data Drift monitoring generation (Evidently AI - D-06)
      run: |
        python src/monitoring/drift.py
